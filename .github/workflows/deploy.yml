name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read GitHub Pages URL
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build site via Docker and extract static output
        env:
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH || steps.pages.outputs.base_path || '/' }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || steps.pages.outputs.origin || 'https://freewareadvancedaudio.github.io' }}
        run: |
          docker build --build-arg SITE_BASE_PATH="$SITE_BASE_PATH" --build-arg SITE_ORIGIN="$SITE_ORIGIN" -t freeware-audio-site --target site-builder .
          container_id=$(docker create freeware-audio-site)
          mkdir -p docs/.vitepress/dist
          docker cp $container_id:/app/docs/.vitepress/dist/. docs/.vitepress/dist/
          docker rm $container_id
          ls -la docs/.vitepress/dist/

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
